name: build

on: [push, pull_request]

jobs:
  ubuntu:
    name: pg${{ matrix.postgres }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ !startsWith(github.ref_name, 'mac') && !startsWith(github.ref_name, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 18
            os: ubuntu-24.04
          - postgres: 17
            os: ubuntu-24.04
          - postgres: 16
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: e2e/go.sum

      - name: Install PostgreSQL ${{ matrix.postgres }}
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}
          dev-files: true

      - name: Compile extension
        run: make
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare ${{ matrix.postgres >= 18 && '-Wno-missing-field-initializers' || '' }}

      - name: Install extension
        run: |
          export PG_CONFIG=`which pg_config`
          sudo --preserve-env=PG_CONFIG make install

      - name: Run regression + isolation + upgrade tests
        run: bash test/run_tests.sh

      - name: Dump regression diffs on failure
        if: ${{ failure() }}
        run: |
          [ -f regression.diffs ] && cat regression.diffs || true
          [ -f test/output/regression.diffs ] && cat test/output/regression.diffs || true

      - name: Run Go end-to-end tests (5 consumers)
        run: E2E_OPS=500 bash e2e/run_e2e.sh

      - name: Run modular benchmarks
        run: |
          mkdir -p bench-results
          bash bench/bench.sh | tee bench-results/bench-pg${{ matrix.postgres }}.txt
          echo "### Benchmark Report (PostgreSQL ${{ matrix.postgres }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bench-results/bench-pg${{ matrix.postgres }}.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run dedicated sustained benchmark matrix
        run: |
          bash bench/bench_dedicated.sh --duration 10s --writers 4 --consumers 2 | tee bench-results/bench-dedicated-pg${{ matrix.postgres }}.txt
          echo "### Dedicated Sustained Benchmark Report (PostgreSQL ${{ matrix.postgres }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bench-results/bench-dedicated-pg${{ matrix.postgres }}.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-pg${{ matrix.postgres }}
          path: bench-results/

  mac:
    name: pg${{ matrix.postgres }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ !startsWith(github.ref_name, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 17
            os: macos-15
          - postgres: 16
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: e2e/go.sum

      - name: Install PostgreSQL ${{ matrix.postgres }}
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}
          dev-files: true

      - name: Compile extension
        run: make
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unknown-warning-option

      - name: Install extension
        run: make install

      - name: Run regression + upgrade tests
        run: bash test/run_tests.sh

      - name: Dump regression diffs on failure
        if: ${{ failure() }}
        run: |
          [ -f regression.diffs ] && cat regression.diffs || true
          [ -f test/output/regression.diffs ] && cat test/output/regression.diffs || true

      - name: Run Go end-to-end tests
        run: E2E_OPS=500 bash e2e/run_e2e.sh

      - name: Static analysis (scan-build)
        run: |
          make clean
          if command -v scan-build >/dev/null 2>&1; then
            scan-build --status-bugs make
          else
            echo "scan-build not found, skipping"
          fi
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING

  valgrind:
    name: Valgrind memory check (pg17)
    if: ${{ !startsWith(github.ref_name, 'mac') && !startsWith(github.ref_name, 'windows') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Postgres with Valgrind
        uses: ankane/setup-postgres-valgrind@v1
        with:
          postgres-version: 17
          check-ub: yes

      - name: Compile
        run: make OPTFLAGS=""
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare

      - name: Install
        run: sudo --preserve-env=PG_CONFIG make install

      - name: Run test suite
        run: bash test/run_tests.sh

      - name: Dump diffs on failure
        if: ${{ failure() }}
        run: |
          [ -f regression.diffs ] && cat regression.diffs || true
          [ -f test/output/regression.diffs ] && cat test/output/regression.diffs || true
